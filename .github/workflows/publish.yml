name: Publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package index
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true

permissions:
  contents: read

jobs:
  release-ref:
    name: Validate release selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Production releases require a matching version tag
        id: version
        env:
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          python - <<'PY'
          import os
          import cells
          target = os.environ['RELEASE_TARGET']
          if target not in ('testpypi', 'pypi'):
              raise SystemExit('Unsupported package index')
          if target == 'pypi' and os.environ['GITHUB_REF'] != f'refs/tags/v{cells.__version__}':
              raise SystemExit(f'Production publishing requires tag v{cells.__version__}')
          print(f'Preparing {cells.__version__} for {target}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={cells.__version__}\n')
          PY

  verify:
    needs: release-ref
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Upload verified distributions
    needs: [release-ref, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.target }}
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution-checksums
          path: checksums/
      - name: Verify exactly the tested archives before upload
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          directory = Path('dist')
          entries = [line.split() for line in Path('checksums/SHA256SUMS').read_text().splitlines()]
          names = [name for digest, name in entries]
          if len(names) != 2 or len(set(names)) != 2 or set(names) != {p.name for p in directory.iterdir()}:
              raise SystemExit('Expected exactly the verified wheel and source archive')
          for digest, name in entries:
              if Path(name).name != name or hashlib.sha256((directory / name).read_bytes()).hexdigest() != digest:
                  raise SystemExit('Distribution checksum mismatch')
          print('Verified both distribution checksums')
          PY
      - name: Publish using the configured Trusted Publisher
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the published wheel in a fresh environment
        env:
          RELEASE_VERSION: ${{ needs.release-ref.outputs.version }}
          INDEX_URL: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/simple/' || 'https://pypi.org/simple/' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              environment = root / 'venv'
              subprocess.run([sys.executable, '-m', 'venv', str(environment)], check=True)
              python = environment / 'bin/python'
              version = os.environ['RELEASE_VERSION']
              subprocess.run([
                  str(python), '-m', 'pip', 'install', '--no-cache-dir', '--no-deps',
                  '--only-binary=:all:', '--index-url', os.environ['INDEX_URL'],
                  f'terminal-cells=={version}',
              ], cwd=root, check=True)
              command = str(environment / 'bin/cells')
              result = subprocess.check_output([command, '--version'], cwd=root, text=True)
              if result.strip() != f'cells {version}':
                  raise SystemExit(f'Unexpected installed version: {result!r}')
              snapshot = subprocess.check_output([
                  command, '--snapshot', '--seed', '42', '--size', '80x24',
              ], cwd=root, text=True)
              if len(snapshot.splitlines()) != 24 or not snapshot.strip():
                  raise SystemExit('Published installation produced an invalid snapshot')
              print(f'Installed and exercised terminal-cells {version} from the selected index')
          PY
